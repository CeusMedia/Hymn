<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice">
	<defs>
		<radialGradient id="glowA" cx="15%" cy="20%" r="45%">
			<stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
			<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glowB" cx="88%" cy="85%" r="50%">
			<stop offset="0" stop-color="#7db9e8" stop-opacity=".45"/>
			<stop offset="1" stop-color="#7db9e8" stop-opacity="0"/>
		</radialGradient>
		<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
			<circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity=".14"/>
		</pattern>
		<g id="module" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
			<path d="M0 -34 L32 -18 V18 L0 34 L-32 18 V-18 Z"/>
			<path d="M-32 -18 L0 -2 L32 -18 M0 -2 V34"/>
		</g>
		<g id="prompt" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
			<rect x="-44" y="-28" width="88" height="56" rx="7"/>
			<path d="M-30 -10 L-18 0 L-30 10 M-10 12 H12"/>
		</g>
	</defs>
	<g fill="#fff">
		<path d="M0 0 L320 0 L180 160 Z" fill-opacity=".10"/>
		<path d="M320 0 L640 0 L470 130 Z" fill-opacity=".06"/>
		<path d="M180 160 L470 130 L330 300 Z" fill-opacity=".05"/>
		<path d="M640 0 L960 0 L800 150 Z" fill-opacity=".08"/>
		<path d="M960 0 L1200 0 L1200 140 Z" fill-opacity=".05"/>
		<path d="M470 130 L800 150 L620 320 Z" fill-opacity=".04"/>
		<path d="M800 150 L1200 140 L1010 330 Z" fill-opacity=".05"/>
		<path d="M0 160 L180 160 L0 420 Z" fill-opacity=".04"/>
		<path d="M330 300 L620 320 L480 420 Z" fill-opacity=".03"/>
		<path d="M1010 330 L1200 300 L1200 420 Z" fill-opacity=".04"/>
	</g>
	<rect width="1200" height="420" fill="url(#dots)"/>
	<rect width="1200" height="420" fill="url(#glowA)"/>
	<rect width="1200" height="420" fill="url(#glowB)"/>
	<!--  module relations  -->
	<g fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" stroke-opacity=".35">
		<path d="M110 300 C 180 220, 200 130, 240 80"/>
		<path d="M240 80 C 420 40, 600 110, 760 60"/>
		<path d="M960 330 C 1000 250, 1040 180, 1080 110"/>
		<path d="M-20 330 C 180 250, 260 380, 430 300 S 700 120, 900 190 S 1120 90, 1230 40"/>
	</g>
	<!--  modules  -->
	<g opacity=".22">
		<use href="#module" transform="translate(110 300) rotate(-12) scale(.9)"/>
		<use href="#module" transform="translate(1080 110) rotate(10) scale(1.3)"/>
		<use href="#module" transform="translate(960 330) rotate(-6) scale(.7)"/>
		<use href="#module" transform="translate(240 80) rotate(8) scale(.6)"/>
	</g>
	<g opacity=".12">
		<use href="#module" transform="translate(1160 260) rotate(-14) scale(.5)"/>
		<use href="#module" transform="translate(40 170) rotate(16) scale(.45)"/>
	</g>
	<!--  console  -->
	<g opacity=".28">
		<use href="#prompt" transform="translate(300 360) rotate(6) scale(.6)"/>
		<use href="#module" transform="translate(760 60) rotate(-4) scale(.5)"/>
	</g>
</svg>
